[package]
name = "noa-court"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/cuongdcdev/noacourt"
publish = false

[workspace]
members = [".", "test-stubs/mock-noa", "test-stubs/mock-outlayer"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
borsh = { version = "1", features = ["unstable__schema"] }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
near-workspaces = { version = "=0.22.1", default-features = false, features = ["install"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
codegen-units = 1
strip = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.20.3-rust-1.86.0"
image_digest = "sha256:a84b7c401a856b6bbbe1975f235b6a8011540a24dfbde248531cccb4b2fdbadf"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
