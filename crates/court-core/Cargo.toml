[package]
name = "court-core"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/cuongdcdev/noacourt"

[lib]
name = "court_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_json_path = "0.7"
rust_decimal = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
quick-xml = "0.37"
ryu-js = "1"
url = "2.5"
